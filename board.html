<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>게임판 · 주류마블 팀전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --edge:#145234;--bg:#E4F0E7;--ink:#10251B;--muted:#4C6658;--cell:#FFFFFF;--board:#1F7A4D;
  --center:#CFE3D5;--tarp:#E2571E;--tarp-deep:#9B3509;--gold:#F2B705;--gold-ink:#2A1D00;
  --scrim:rgba(6,20,13,.6);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --edge:#0B3A22;--bg:#0A1C14;--ink:#E6F1EA;--muted:#9BB5A6;--cell:#14311F;--board:#2E9A62;
    --center:#0F2719;--scrim:rgba(0,0,0,.7);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --edge:#0B3A22;--bg:#0A1C14;--ink:#E6F1EA;--muted:#9BB5A6;--cell:#14311F;--board:#2E9A62;
  --center:#0F2719;--scrim:rgba(0,0,0,.7);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:14px 12px 40px}
.disp{font-family:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:6px 2px 12px}
h1{margin:0;font-size:clamp(40px,12vw,58px);line-height:.9;color:var(--tarp);letter-spacing:-1px}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0}
.ghost{background:none;border:1.5px solid var(--muted);color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* setup */
.setup{max-width:560px;margin-left:auto;margin-right:auto;background:var(--cell);border-radius:16px;padding:18px;border-top:8px solid var(--tarp)}
.setup h2{margin:0 0 4px;font-size:24px}
.setup p{margin:0 0 14px;color:var(--muted);font-size:14px}
.team{border-left:5px solid var(--c);padding:2px 0 2px 10px;margin-bottom:14px}
.trow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.team input{min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--center);background:var(--bg);color:var(--ink);width:100%}
.trow input{flex:1;font-family:"Black Han Sans",sans-serif}
.trow .x{width:40px;height:40px;flex:none;border:none;background:none;color:var(--muted);font-size:22px;cursor:pointer;border-radius:10px}
.team .mem{font-size:15px}
.addp{width:100%;padding:10px;border:1.5px dashed var(--muted);background:none;color:var(--muted);border-radius:10px;font:inherit;font-size:15px;cursor:pointer;margin:0 0 16px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;font-size:15px;flex-wrap:wrap}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--ink);font:inherit;font-size:15px;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--tarp);color:#fff}
.big{width:100%;font-size:22px;background:var(--tarp);color:#fff;border:0;border-radius:999px;padding:13px 20px;box-shadow:0 4px 0 var(--tarp-deep);cursor:pointer;margin-top:6px}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tarp-deep)}
.rank{margin:0 0 18px;padding:0;list-style:none;counter-reset:r}
.rank li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--center);font-size:17px;counter-increment:r}
.rank li::before{content:counter(r);font-family:"Black Han Sans",sans-serif;width:24px;text-align:center;color:var(--muted)}
.rank li:first-child::before{content:"🏆"}
.rank li::before{display:none}.rank li .rk{min-width:34px;text-align:center;font-family:"Black Han Sans",sans-serif;color:var(--muted);font-weight:400;white-space:nowrap}
.rank .dot{width:12px;height:12px;border-radius:50%;flex:none}
.rank small{margin-left:auto;color:var(--muted);font-size:14px}
.setup .ovmsg{font-size:16px;color:var(--ink);line-height:1.55}

/* board (3D) */
.stage3d{perspective:1100px;perspective-origin:50% 0%;padding:2px 2px 30px;margin-top:-2%}
.board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:3px;aspect-ratio:1;width:100%;
  background:var(--board);padding:4px;border-radius:12px;transform:rotateX(28deg);transform-origin:50% 55%;transform-style:preserve-3d;
  box-shadow:0 12px 0 var(--edge),0 30px 36px rgba(0,0,0,.35)}
.cell{background:var(--cell);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding-top:10%;position:relative;text-align:center;min-width:0;cursor:pointer;border:0;color:inherit;font:inherit;
  transform-style:preserve-3d;box-shadow:0 3px 0 rgba(0,0,0,.2);transition:transform .2s}
.cell .e{font-size:clamp(15px,4.6vw,24px);line-height:1}
.cell .t{font-size:clamp(9px,2.5vw,13px);line-height:1.15;margin-top:2px;white-space:nowrap;max-width:100%;overflow:hidden}
.cell.gold{background:var(--gold);color:var(--gold-ink)}
.cell.start{background:var(--tarp);color:#fff}
.cell.lit{box-shadow:inset 0 0 0 3px var(--tarp),0 3px 0 rgba(0,0,0,.2);transform:translateZ(5px)}
.cell.start.lit,.cell.gold.lit{box-shadow:inset 0 0 0 3px var(--ink),0 3px 0 rgba(0,0,0,.2)}
.toks{position:absolute;left:1px;right:1px;bottom:8%;display:flex;flex-wrap:wrap;gap:1px;justify-content:center;transform-style:preserve-3d;pointer-events:none}
.tok{width:clamp(8px,2.4vw,13px);height:clamp(13px,3.8vw,20px);border-radius:50% 50% 38% 38%/42% 42% 32% 32%;border:1.5px solid #fff;
  transform-origin:50% 100%;transform:rotateX(-28deg);box-shadow:inset -2px -3px 0 rgba(0,0,0,.28);filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))}
.tok.me{animation:hop .9s ease-in-out infinite}
@keyframes hop{0%,100%{transform:rotateX(-28deg) translateY(0)}50%{transform:rotateX(-28deg) translateY(-35%)}}

.center{grid-column:2/7;grid-row:2/7;background:var(--center);border-radius:8px;display:flex;flex-direction:column;transform-style:preserve-3d;
  align-items:center;justify-content:center;gap:clamp(5px,1.8vw,11px);padding:8px;text-align:center}
.turn{font-size:clamp(16px,4.6vw,22px);display:flex;align-items:center;gap:6px}
.turn .dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.rep{font-size:clamp(12px,3.4vw,15px);color:var(--muted);margin-top:-4px}
.dice{display:flex;gap:12px}
.dice{transform-style:preserve-3d;gap:clamp(14px,5vw,30px)}
.die3{--s:clamp(30px,9vw,52px);width:var(--s);height:var(--s);transform-style:preserve-3d;transform:translateZ(calc(var(--s) / 2))}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.75,.25,1)}
.f{position:absolute;inset:0;background:#fff;border-radius:18%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),inset -3px -3px 6px rgba(0,0,0,.12);backface-visibility:hidden}
.f i{width:62%;height:62%;margin:auto;border-radius:50%;background:#1d1d1d;visibility:hidden}
.f i.on{visibility:visible}.f.f1 i.on{background:#D7262E;width:80%;height:80%}
.f1{transform:translateZ(calc(var(--s) / 2))}.f6{transform:rotateY(180deg) translateZ(calc(var(--s) / 2))}
.f2{transform:rotateY(90deg) translateZ(calc(var(--s) / 2))}.f5{transform:rotateY(-90deg) translateZ(calc(var(--s) / 2))}
.f3{transform:rotateX(90deg) translateZ(calc(var(--s) / 2))}.f4{transform:rotateX(-90deg) translateZ(calc(var(--s) / 2))}
.logo{font-family:"Black Han Sans",sans-serif;color:var(--tarp);font-size:clamp(20px,6vw,34px);opacity:.9;letter-spacing:-.5px}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-top:4px}
.roll{font-size:clamp(17px,5vw,22px);background:var(--tarp);color:#fff;border:0;border-radius:999px;padding:9px 26px;
  box-shadow:0 4px 0 var(--tarp-deep);cursor:pointer}
.roll:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tarp-deep)}
.roll:disabled{opacity:.55;cursor:default}
.log{font-size:clamp(11px,3.2vw,14px);color:var(--muted);min-height:1.3em;max-width:100%;padding:0 4px}

.players{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--cell);font-size:14px}
.chip .dot{width:12px;height:12px;border-radius:50%}
.chip.cur{box-shadow:0 0 0 2px var(--tarp)}
.chip small{color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin:16px 2px 0;line-height:1.5}
.note b{color:var(--ink);font-weight:400;font-family:"Black Han Sans",sans-serif}

/* modal */
.modal{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.on{display:flex}
.card{background:var(--cell);width:100%;max-width:360px;border-radius:18px;padding:22px 22px 20px;text-align:center;
  border-top:12px solid var(--tarp);animation:pop .28s ease-out}
.card.goldc{border-top-color:var(--gold)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.card .who{color:var(--muted);font-size:14px;margin:0}
.card .em{font-size:60px;line-height:1.1;margin-top:6px}
.card h2{font-size:34px;margin:4px 0 8px}
.card p{font-size:18px;line-height:1.55;margin:0 0 6px}
.card .extra{color:var(--tarp);font-size:16px;margin:8px 0 0;white-space:pre-line}
.card .big{margin-top:16px;font-size:20px;padding:11px}
.card{max-height:calc(100dvh - 40px);overflow:auto}
.rec{margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--center)}
.rec span{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.recb{display:flex;flex-direction:column;gap:6px}
.recrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;padding:4px 0;border-left:5px solid var(--c);padding-left:8px}
.recrow .rn{flex:1 1 90px;font-weight:700;text-align:left;color:var(--ink);font-size:15px;margin:0}
.recrow.off{opacity:.4}.recrow .rz{font-size:13px;color:var(--muted);margin:0}
.recrow .rw{flex-basis:100%;text-align:right;font-size:13px;font-weight:700;color:var(--c)}
.recrow button[data-v="0"][aria-pressed="true"]{background:#8a97a3;border-color:#8a97a3}
#mOk.pendingOk{background:#e9eef2!important;color:#33424d!important;box-shadow:0 4px 0 #c5ccd3!important;font-size:16px!important}
.tgt{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
.recb button.off{opacity:.3;border-style:dashed;cursor:not-allowed}
.recb button,.tgt button{font:inherit;font-size:15px;padding:7px 13px;border-radius:999px;border:2px solid var(--c);background:none;color:var(--ink);cursor:pointer}
.recb button[aria-pressed="true"],.tgt button[aria-pressed="true"]{background:var(--c);color:#fff}
.chip .minus{border:0;background:var(--bg);color:var(--muted);width:24px;height:24px;border-radius:50%;font:inherit;font-size:16px;line-height:1;cursor:pointer;padding:0}
.card #mAct{margin-top:12px;font-size:16px;padding:8px 18px;color:var(--ink);border-color:var(--ink);margin-right:6px}
.card #mTimer{margin-top:12px;font-size:16px;padding:8px 18px;color:var(--ink);border-color:var(--ink)}

.spin{position:fixed;inset:0;background:var(--scrim);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:25;padding:20px}
.spin.on{display:flex}
.spin .lbl{color:#fff;font-size:18px}
.spin .nm{font-family:"Black Han Sans",sans-serif;font-size:clamp(40px,13vw,72px);color:#fff;padding:16px 34px;border-radius:22px;min-width:min(80vw,420px);text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.spin.done .nm{animation:pop .35s ease-out}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;transition:.25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== 보드 v4: 밝은 하늘 배경 + 입체 블록 타일 + 세워진 표지판 ===== */
.stage3d{perspective:1300px;perspective-origin:50% -25%;padding:26px 6px 56px;border-radius:24px;margin-top:0;
  background:radial-gradient(130px 34px at 16% 18%,rgba(255,255,255,.95),transparent 72%),radial-gradient(170px 44px at 82% 10%,rgba(255,255,255,.9),transparent 72%),
  radial-gradient(120px 30px at 70% 88%,rgba(255,255,255,.7),transparent 72%),linear-gradient(180deg,#4fbdf2,#9fe0ff 55%,#d6f5ff)}
.board{--tx:44deg;--tz:-30deg;transform:rotateX(var(--tx)) rotateZ(var(--tz));transform-origin:50% 55%;width:68%;margin:0 auto;
  gap:5px;padding:8px;border-radius:18px;background:linear-gradient(135deg,#fff6df,#f5dca6);
  box-shadow:0 0 0 4px #fff,0 0 0 9px #f2a93b,0 12px 0 9px #c6741a,0 30px 44px 10px rgba(20,60,95,.45)}
.cell{border-radius:8px;padding:0;background:#fff;color:#1b2a22;--top:#c9d1d6;--side:#9aa6ad;
  box-shadow:0 5px 0 var(--side),0 8px 8px rgba(0,0,0,.18);transform:translateZ(0);transition:transform .2s}
.cell::before{content:"";position:absolute;left:0;right:0;top:0;height:30%;border-radius:8px 8px 3px 3px;background:var(--top)}
.cell.vs{--top:#F0524F;--side:#B3302D}
.cell.team{--top:#2FB36B;--side:#1D7C47}
.cell.all{--top:#3E7BFA;--side:#2350B0}
.cell.rest{--top:#22B8D8;--side:#127F98}
.cell.drink{--top:#E8436A;--side:#A3213F}
.cell.game{--top:#3E7BFA;--side:#2350B0}
.cell.choose{--top:#9B51E0;--side:#6A2BA8}
.cell.gold{--side:#9b6800;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%) 0 0/300% 100% no-repeat,linear-gradient(135deg,#ffe58a,#f6b90b 48%,#d39100);animation:sheen 3.4s ease-in-out infinite}
.cell.start{--side:#9B3509;background:linear-gradient(160deg,#ff9255,#e2571e 60%,#c4440f)}
.cell.gold::before,.cell.start::before{display:none}
@keyframes sheen{0%,55%{background-position:130% 0,0 0}100%{background-position:-30% 0,0 0}}
.cell.lit{transform:translateZ(8px);box-shadow:0 5px 0 var(--side),0 0 0 3px #fff,0 0 0 6px var(--tarp),0 12px 12px rgba(0,0,0,.25)}
.cell.lit::after{content:"";position:absolute;inset:-2px;border-radius:10px;border:3px solid #fff;animation:ring 1.3s ease-out infinite;pointer-events:none}
@keyframes ring{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
/* 칸 표지판: 화면을 향해 세워져서 글씨가 똑바로 보임 */
.sign{position:absolute;left:-14%;right:-14%;bottom:42%;display:flex;flex-direction:column;align-items:center;gap:1px;
  transform-origin:50% 100%;transform:rotateZ(calc(var(--tz) * -1)) rotateX(calc(var(--tx) * -1));pointer-events:none}
.sign .t{order:0;max-width:none;overflow:visible;margin:0;font-size:clamp(8px,2.1vw,13px);line-height:1.2;color:#17241c;background:rgba(255,255,255,.95);
  padding:1px 5px;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.3);white-space:nowrap}
.sign .e{order:1;margin:0;font-size:clamp(14px,4vw,28px);line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
/* 체스말 */
.toks{left:0;right:0;bottom:3%;gap:0;flex-wrap:nowrap}
.tok{width:clamp(10px,2.7vw,17px);height:clamp(15px,4vw,25px);border:0;border-radius:0;background:none!important;box-shadow:none;margin:0 -1px;
  transform-origin:50% 100%;transform:rotateZ(calc(var(--tz) * -1)) rotateX(calc(var(--tx) * -1));filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.45))}
.tok svg{display:block;width:100%;height:100%;overflow:visible}
.tok.me{animation:hop3 .9s ease-in-out infinite}
@keyframes hop3{0%,100%{transform:rotateZ(calc(var(--tz) * -1)) rotateX(calc(var(--tx) * -1)) translateY(0)}50%{transform:rotateZ(calc(var(--tz) * -1)) rotateX(calc(var(--tx) * -1)) translateY(-40%)}}
/* 가운데 판 */
.center{background:linear-gradient(135deg,#ffffff,#e6f5ff);border-radius:14px;box-shadow:inset 0 0 0 3px #f2a93b,inset 0 4px 14px rgba(0,0,0,.12)}
.logo{color:#ff6a2b;font-size:clamp(20px,5vw,40px);text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 5px 0 rgba(0,0,0,.18)}
.dice{padding:clamp(8px,2vw,14px) clamp(14px,4vw,26px);border-radius:16px;background:rgba(40,110,170,.16);box-shadow:inset 0 3px 8px rgba(0,0,0,.2)}
/* 버튼과 차례 표시 */
.roll{background:linear-gradient(180deg,#ffd84d,#f5a50c);color:#5a2c00;border:3px solid #fff;box-shadow:0 5px 0 #c26a00,0 9px 14px rgba(0,0,0,.25);font-size:clamp(20px,5.5vw,28px);padding:10px 34px}
.roll:active{transform:translateY(3px);box-shadow:0 2px 0 #c26a00}
.turn{font-family:"Black Han Sans",sans-serif;font-size:clamp(22px,6vw,32px);padding:10px 26px;border-radius:999px;background:var(--tarp);color:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.28),0 0 0 3px rgba(255,255,255,.85);letter-spacing:-.3px;gap:6px}
.turn .dot{display:none}
.turn b{font-weight:400}
#rep{font-size:15px;color:var(--ink);opacity:.8}
.chip{border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.chip.cur{box-shadow:0 0 0 3px var(--tarp),0 3px 0 rgba(0,0,0,.12)}
@media (prefers-reduced-motion:reduce){.cell.gold{animation:none}.cell.lit::after{display:none}}
/* v5: 판 크게 + 아래 글씨와 겹치지 않게 (원근은 JS가 폭에 맞춰 조절) */
.stage3d{padding:9% 0 21%}
.board{--tx:40deg;--tz:-24deg;width:76%;margin:0 auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:12px;color:var(--muted);margin:8px 0 10px}.legend b{font-weight:inherit}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* v6: 쿼터뷰(마름모) 시점 — 출발 칸이 맨 앞 꼭짓점에 오도록 판을 45도 돌리고 위에서 비스듬히 내려다봄 */
.stage3d{padding:5% 0 8%}
.board{--tx:56deg;--tz:45deg;width:70%;transform-origin:50% 50%;
  box-shadow:0 0 0 4px #fff,0 0 0 9px #f2a93b,9px 9px 0 9px #c6741a,22px 22px 40px 12px rgba(20,60,95,.4)}
.cell{box-shadow:3.5px 3.5px 0 var(--side),6px 6px 8px rgba(0,0,0,.16)}
.cell.lit{box-shadow:3.5px 3.5px 0 var(--side),0 0 0 3px #fff,0 0 0 6px var(--tarp),8px 8px 12px rgba(0,0,0,.22)}
.sign .e{font-size:clamp(12px,3.4vw,24px)}
.logo{transform-origin:50% 100%;transform:rotateZ(calc(var(--tz) * -1)) rotateX(calc(var(--tx) * -1))}
/* v7: 테두리 칸을 안쪽으로 길쭉하게(직사각형) 키워서 표지판이 자기 칸 안에 들어가게 */
.board{grid-template-columns:1.8fr repeat(5,1fr) 1.8fr;grid-template-rows:1.8fr repeat(5,1fr) 1.8fr;width:72%}
.cell::before{height:20%}
.sign{bottom:28%;left:-30%;right:-30%}
.sign .t{font-size:clamp(8px,2vw,12px);padding:1px 4px}
.sign .e{font-size:clamp(12px,3.2vw,22px)}
.cell.corner .sign .e{font-size:clamp(15px,4vw,28px)}
.toks{bottom:6%}
/* v8: 칸 이름을 판 위에 인쇄된 것처럼 납작하게 (세운 표지판 X)
   판 회전(45°)을 되돌리고 기울기로 눌린 만큼(1/cos56° ≈ 1.79) 세로로 늘려서 화면에서 반듯하게 보이게 함 */
.sign{inset:0;left:0;right:0;bottom:auto;top:0;height:100%;justify-content:center;gap:0;
  transform-origin:50% 50%;transform:rotateZ(calc(var(--tz) * -1)) scaleY(1.79)}
.sign .t{background:none;box-shadow:none;padding:0;border-radius:0;font-size:clamp(7px,1.9vw,11px);line-height:1.1;color:#17241c;
  text-shadow:0 1px 0 rgba(255,255,255,.85)}
.sign .e{font-size:clamp(10px,2.8vw,18px);filter:none}
.cell.corner .sign .e{font-size:clamp(13px,3.6vw,24px)}
.cell.corner .sign .t{font-size:clamp(9px,2.3vw,13px)}
.cell.start .sign .t{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.cell.gold .sign .t{color:#3a2700;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.logo{transform-origin:50% 50%;transform:rotateZ(calc(var(--tz) * -1)) scaleY(1.79);text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff}
/* v9: 칸 이름을 칸 방향을 따라 자연스럽게 인쇄 (모노폴리처럼 칸의 긴 방향으로)
   아래/위 줄 칸은 세로로 긴 칸 → 글씨를 90° 돌려 긴 방향으로, 왼쪽/오른쪽 줄 칸은 가로로 긴 칸 → 그대로 */
.sign{position:absolute;inset:auto;left:50%;top:50%;width:100%;height:100%;flex-direction:row;justify-content:center;align-items:center;gap:3%;
  transform-origin:50% 50%;transform:translate(-50%,-50%)}
.cell.side-b .sign,.cell.side-t .sign{width:180%;height:55.5%;transform:translate(-50%,-50%) rotate(-90deg)}
.cell.corner .sign{flex-direction:column;gap:2px;transform:translate(-50%,-50%) rotate(calc(var(--tz) * -1))}
.sign .t{font-size:clamp(7px,1.9vw,12px);letter-spacing:-.4px;color:#17241c;text-shadow:0 1px 0 rgba(255,255,255,.9)}
.sign .e{font-size:clamp(10px,2.8vw,19px);order:-1}
.cell.corner .sign .t{order:1}
/* 색 띠는 판 바깥쪽 가장자리에 */
.cell.side-b::before{top:auto;bottom:0;height:18%;border-radius:3px 3px 8px 8px}
.cell.side-t::before{top:0;height:18%}
.cell.side-l::before{left:0;right:auto;top:0;bottom:0;width:18%;height:auto;border-radius:8px 3px 3px 8px}
.cell.side-r::before{right:0;left:auto;top:0;bottom:0;width:18%;height:auto;border-radius:3px 8px 8px 3px}
/* v10: 칸 전체를 색으로 칠하고 이름을 흰 글씨로 인쇄, 나무 테두리, 밝은 석판 가운데, 모서리는 도드라진 큰 판 */
.board{background:linear-gradient(135deg,#8c5c3b,#6b4128);gap:3px;padding:7px;border-radius:16px;
  box-shadow:0 0 0 3px #d9a866,0 0 0 9px #7b4b2c,9px 9px 0 9px #4a2b18,24px 24px 42px 14px rgba(25,45,70,.45)}
.cell{border-radius:5px;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--top) 78%,#fff),var(--top) 55%);
  box-shadow:2.5px 2.5px 0 var(--side),5px 5px 6px rgba(0,0,0,.18)}
.cell::before{display:none}
.cell.rest{--top:#25AFCF;--side:#13788F}
.sign .t{color:#fff;font-size:clamp(8px,2.1vw,13px);letter-spacing:-.3px;text-shadow:0 1px 0 rgba(0,0,0,.28)}
.cell:not(.corner):not(.gold) .sign .e{display:none}
/* 황금카드: 금박 카드 칸 */
.cell.gold .sign .t{color:#4a3000;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.cell.gold .sign .e{font-size:clamp(9px,2.4vw,15px)}
/* 모서리: 살짝 떠 있는 하얀 판 */
.cell.corner{background:linear-gradient(135deg,#ffffff,#e3f0f8);--side:#9fb3c2;border-radius:12px;transform:translateZ(5px);
  box-shadow:3px 3px 0 var(--side),7px 7px 10px rgba(0,0,0,.22)}
.cell.corner .sign .t{color:#1f3a52;text-shadow:none;font-size:clamp(9px,2.4vw,14px)}
.cell.corner .sign .e{display:block;font-size:clamp(16px,4.6vw,32px);filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.cell.start.corner{background:linear-gradient(135deg,#ffffff,#ffe9dc);--side:#d39a7a}
.cell.start .sign .t{color:#e2571e;text-shadow:none}
.cell.lit.corner{transform:translateZ(9px)}
/* 가운데: 밝은 석판 + 이중 테두리 */
.center{background:radial-gradient(circle at 50% 45%,#fbf8f2,#e8e1d3 80%);border-radius:6px;
  box-shadow:inset 0 0 0 3px #f8f3ea,inset 0 0 0 5px #cdb27c,inset 0 0 0 9px #f8f3ea,inset 0 0 0 10px #d8c497,inset 0 6px 18px rgba(0,0,0,.12)}
.logo{color:#c4561d;text-shadow:0 1px 0 #fff,0 2px 0 rgba(0,0,0,.12)}
.dice{background:rgba(120,90,50,.12);box-shadow:inset 0 3px 8px rgba(80,50,20,.25)}
/* v11: 사람 모양 말 + 한 칸씩 폴짝 걷는 움직임 */
.tok{width:clamp(12px,3.2vw,20px);height:clamp(18px,4.8vw,30px);margin:0 -2px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.tok svg .lgl,.tok svg .lgr,.tok svg .arl,.tok svg .arr{transform-box:fill-box;transform-origin:50% 8%}
.tok.walk{animation:stepHop .38s ease-out;z-index:3}
.tok.walk .lgl,.tok.walk .arr{animation:swingA .38s ease-in-out}
.tok.walk .lgr,.tok.walk .arl{animation:swingB .38s ease-in-out}
@keyframes stepHop{0%{transform:rotateZ(calc(var(--tz) * -1)) rotateX(calc(var(--tx) * -1)) translateY(0) scaleY(.92)}
  40%{transform:rotateZ(calc(var(--tz) * -1)) rotateX(calc(var(--tx) * -1)) translateY(-55%) scaleY(1.04)}
  85%{transform:rotateZ(calc(var(--tz) * -1)) rotateX(calc(var(--tx) * -1)) translateY(0) scaleY(.94)}
  100%{transform:rotateZ(calc(var(--tz) * -1)) rotateX(calc(var(--tx) * -1)) translateY(0) scaleY(1)}}
@keyframes swingA{0%,100%{transform:rotate(0)}30%{transform:rotate(28deg)}70%{transform:rotate(-22deg)}}
@keyframes swingB{0%,100%{transform:rotate(0)}30%{transform:rotate(-28deg)}70%{transform:rotate(22deg)}}
.tok.me:not(.walk) .arr{animation:cheers 1.8s ease-in-out infinite}
@keyframes cheers{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-55deg)}90%{transform:rotate(-40deg)}}
@media (prefers-reduced-motion:reduce){.tok.walk,.tok.walk *,.tok.me .arr{animation:none!important}}
/* v12: 글씨 잘 보이게 — 덜 기울이고, 칸을 더 길게, 글자 수에 맞춘 크기 + 테두리 */
.stage3d{padding:7% 0 12%}
.board{--tx:50deg;grid-template-columns:2.1fr repeat(5,1fr) 2.1fr;grid-template-rows:2.1fr repeat(5,1fr) 2.1fr}
.cell.side-b .sign,.cell.side-t .sign{width:210%;height:47.6%}

.sign .t{color:#fff;font-size:clamp(9px,2.6vw,16px);letter-spacing:-.2px;transform:scaleY(1.18);
  text-shadow:0 0 2px rgba(0,0,0,.6),0 1px 1px rgba(0,0,0,.6),1px 0 1px rgba(0,0,0,.4),-1px 0 1px rgba(0,0,0,.4)}
.sign .t[data-len="1"],.sign .t[data-len="2"]{font-size:clamp(10px,3vw,18px)}
.sign .t[data-len="4"]{font-size:clamp(8px,2.25vw,14px)}
.sign .t[data-len="5"],.sign .t[data-len="6"]{font-size:clamp(7.5px,1.95vw,12px)}
.cell.gold .sign .t{color:#3a2600;text-shadow:0 0 2px rgba(255,255,255,.9),0 1px 0 rgba(255,255,255,.7)}
.cell.corner .sign .t{transform:none;text-shadow:none}
/* 미션 카드 속 주사위 */
.mdice{display:flex;justify-content:center;gap:22px;margin:14px 0 6px;perspective:600px}
.mdice .die3{--s:58px;transform:rotateX(-22deg) rotateY(-28deg)}

/* 패배(상한 도달) 팀: 유령 말 */
.tok.spirit{opacity:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.tok.spirit:not(.walk){animation:ghostFloat 2.4s ease-in-out infinite}
@keyframes ghostFloat{0%,100%{transform:rotateZ(calc(var(--tz) * -1)) rotateX(calc(var(--tx) * -1)) translateY(-8%)}50%{transform:rotateZ(calc(var(--tz) * -1)) rotateX(calc(var(--tx) * -1)) translateY(-26%)}}
.tcard.lost{opacity:.75;background:repeating-linear-gradient(135deg,var(--cell) 0 10px,rgba(120,140,160,.12) 10px 20px)}
@media (prefers-reduced-motion:reduce){.tok.spirit{animation:none!important}}
/* 특별 모서리: 보물창고 카드 고르기, 택시 칸 고르기 */

.taxibar{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:27;background:#ffd84d;color:#4a2b00;
  border:3px solid #fff;border-radius:999px;padding:10px 20px;font-family:"Black Han Sans",sans-serif;font-size:18px;box-shadow:0 5px 0 #c26a00;display:none;white-space:nowrap}

/* v13: 말 크게 + 현재 칸은 네모 테두리 대신 바닥 빛 + 위쪽 줄 글씨 방향 수정 */
.toks{bottom:16%;gap:0}
.tok{width:clamp(20px,5.6vw,32px);height:clamp(30px,8.4vw,48px);margin:0 -6px}
.cell.lit,.cell.start.lit,.cell.gold.lit,.cell.lit.corner{box-shadow:3.5px 3.5px 0 var(--side),6px 6px 8px rgba(0,0,0,.16)}
.cell.lit::after{inset:auto;left:50%;top:50%;width:78%;height:auto;aspect-ratio:1;transform:translate(-50%,-50%);border:0;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,70,.95) 0,rgba(255,214,70,.55) 40%,rgba(255,214,70,0) 70%);animation:floorGlow 1.4s ease-in-out infinite}

.logo{white-space:nowrap;font-size:clamp(14px,3.6vw,26px)!important}

.tcard.bump{animation:bump .6s ease-out}@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.06);box-shadow:0 0 0 4px #ffd84d}100%{transform:scale(1)}}

/* 위쪽 줄 글씨 방향: 아래쪽 줄과 같은 방향으로 (정투영 쿼터뷰에서 바로 읽히게) */

      function end(){if(ended)return;ended=true;clearInterval(iv);rows.querySelectorAll('.picked').forEach(x=>x.classList.remove('picked'));
        const ans=String(q.a)[0];btnsOf.forEach(([bo,bx],tm)=>{bo.disabled=bx.disabled=true;(ans==='O'?bo:bx).classList.add('isAns');const v=pick[tm.name];const pb=v==='O'?bo:v==='X'?bx:null;if(pb)pb.classList.add(v===ans?'okPick':'wrongPick')});

        const out=alive.filter(tm=>pick[tm.name]!==ans);out.forEach(tm=>groupLose(tm));

        alive=alive.filter(tm=>pick[tm.name]===ans);board.textContent=log.join('\n');
        setTimeout(()=>{cd.remove();rows.remove();busyQ=false;
          if(round>=ROUNDS||alive.length<=1){overQ=true;return finish()}

  }};

function makeWheel(pool){
  const n=pool.length,seg=360/n,R=100,NS='http://www.w3.org/2000/svg';
  const wrap=mk('div','wheel');const disc=document.createElementNS(NS,'svg');disc.setAttribute('viewBox','-110 -110 220 220');disc.classList.add('wdisc');
  const g=document.createElementNS(NS,'g');disc.appendChild(g);
  const pt=a=>{const r=(a-90)*Math.PI/180;return [R*Math.cos(r),R*Math.sin(r)]};
  const slices=pool.map((o,k)=>{const a0=k*seg,a1=(k+1)*seg,[x0,y0]=pt(a0),[x1,y1]=pt(a1);
    const sl=document.createElementNS(NS,'g');sl.classList.add('wsl');
    const path=document.createElementNS(NS,'path');path.setAttribute('d',n===1?`M0 -${R}A${R} ${R} 0 1 1 -0.01 -${R}Z`:`M0 0L${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${seg>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z`);
    path.setAttribute('fill',o.color);path.setAttribute('stroke','#fff');path.setAttribute('stroke-width','2.5');sl.appendChild(path);
    const tx=document.createElementNS(NS,'text');tx.setAttribute('transform',`rotate(${a0+seg/2}) translate(0 -${R*(n>4?0.66:0.6)})`);
    tx.setAttribute('text-anchor','middle');tx.setAttribute('dominant-baseline','middle');tx.setAttribute('fill',onColor(o.color));
    const nm=[...o.name.trim()];tx.textContent=nm.length>6?nm.slice(0,5).join('')+'…':o.name.trim();tx.setAttribute('font-size',String(n>6?10:n>4?12:n>3?15:18));tx.setAttribute('font-weight','800');sl.appendChild(tx);
    g.appendChild(sl);return sl});
  for(let k=0;k<16;k++){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',(104*Math.cos(k*Math.PI/8)).toFixed(1));c.setAttribute('cy',(104*Math.sin(k*Math.PI/8)).toFixed(1));c.setAttribute('r','3.2');c.classList.add('wbulb');c.style.animationDelay=(k%2?.35:0)+'s';disc.appendChild(c)}
  const hub=document.createElementNS(NS,'circle');hub.setAttribute('r','16');hub.classList.add('whub');disc.appendChild(hub);
  const hubT=document.createElementNS(NS,'text');hubT.textContent='🎰';hubT.setAttribute('text-anchor','middle');hubT.setAttribute('dominant-baseline','central');hubT.setAttribute('font-size','16');disc.appendChild(hubT);
  const ptr=mk('div','wptr');wrap.append(ptr,disc);
  const spin=(w,dur)=>new Promise(res=>{
    const jit=(Math.random()-.5)*seg*.6,turns=reduce?1:Math.max(3,Math.round(dur/800))+Math.floor(Math.random()*2);
    const end=turns*360+(360-(w*seg+seg/2))+jit;g.style.transition=`transform ${dur}ms cubic-bezier(.12,.62,.08,1)`;
    let last=0;const t0=performance.now();
    const tick=()=>{const m=getComputedStyle(g).transform;let ang=0;if(m&&m!=='none'){const v=m.match(/matrix\(([^)]+)\)/);if(v){const [a,b]=v[1].split(',').map(Number);ang=Math.atan2(b,a)*180/Math.PI}}
      const idx=Math.floor(((ang%360)+360)%360/seg);if(idx!==last){last=idx;sfx('tick');ptr.classList.remove('kick');void ptr.offsetWidth;ptr.classList.add('kick')}
      if(performance.now()-t0<dur+100)requestAnimationFrame(tick)};
    requestAnimationFrame(()=>{g.style.transform=`rotate(${end}deg)`;requestAnimationFrame(tick)});
    window.__native.setTimeout(()=>{slices[w].classList.add('win');wrap.classList.add('done');sfx('win');res()},dur+150)});
  return {wrap,spin};
}

function buildDie(el){

  const c=document.createElement('div');c.className='cube';
  for(let n=1;n<=6;n++){const f=document.createElement('div');f.className='f f'+n;
    for(let k=0;k<9;k++){const p=document.createElement('i');if(PIPS[n].includes(k))p.className='on';f.appendChild(p)}
    c.appendChild(f)}
  el.appendChild(c);el._t=0;
}
function setDie(el,n,spin){
  buildDie(el);const c=el.querySelector('.cube');

let walking=null;
async function step(t,n){
  const dir=n>0?1:-1;let passed=false;walking=t;if(n){t.isle=false;t.lastDir=dir}
  for(let k=0;k<Math.abs(n);k++){
    if(dir<0&&t.pos===0){if(t.laps>0){t.laps--;t.pos=23}else break}else t.pos=(t.pos+dir+24)%24;
    if(dir>0&&t.pos===0){t.laps++;passed=true;if((t.drinks||0)>=CAP()&&t.laps>=S.goal)toast(`👻 ${JEUN(t.name)} 패배 팀이라 골인해도 게임이 끝나지 않아요`)}
    renderBoard();await sleep(reduce?40:380);
    if(dir>0&&t.pos===0&&isFin(t))break;
  }
  walking=null;renderBoard();await sleep(reduce?0:250);
  return passed;
}
function advance(){
  S.teams[S.cur].mi++;
  const n=S.teams.length;
  // 누군가 골인한 라운드: 이번 라운드에 남은 차례만 진행하고 끝
  if(S.endRound){for(let j=S.cur+1;j<n;j++){const t=S.teams[j];if(t.fin||lostStop(t))continue;if(t.skip>0){t.skip--;toast(`${JEUN(t.name)} 무인도에서 쉬는 중 🏝️`);continue}S.cur=j;return}S.roundOver=true;return}
  for(let guard=0;guard<n*2;guard++){
    const prev=S.cur;S.cur=(S.cur+1)%n;if(S.cur<=prev){S.rnd=(S.rnd||0)+1;const e=TOAST_EVERY();if(e&&S.rnd%e===0)S.toastDue=true}const t=S.teams[S.cur];
    if(t.fin||lostStop(t))continue;
    if(t.skip>0){t.skip--;toast(`${JEUN(t.name)} 무인도에서 쉬는 중 🏝️`);continue}
    break;
  }
}

  await modal({who:`${S.rnd}라운드 끝`,e:'🥂',t:'라운드 건배!',d:`모두 자기 잔으로 한 잔! 셋 세고 다 같이 건배. 순위(벌주 기록)에는 안 들어가요.${off.length?` ${JEUN(off.map(o=>o.name).join(', '))} 물로 건배 💧`:''}`})}
// 🛡️ 면제권으로 주사위 ±1칸: 굴린 뒤 도착 칸을 보고 고를 수 있어요 (면제권 1개 사용)
function passAdjust(t,mv){return new Promise(res=>{
  const box=$('pickOpts');box.innerHTML='';box.className='opts adj';
  const opt=(d,label)=>{const n=mv+d,c=cellAt((t.pos+n)%24),o=document.createElement('button');o.className='opt'+(d?'':' keep');
    o.innerHTML='<div class="oe"></div><div class="ot"></div><div class="od"></div>';o.querySelector('.oe').textContent=c.e;o.querySelector('.ot').textContent=`${label} → ${c.t}`;o.querySelector('.od').textContent=d?`🛡️ 면제권 1개 사용 · ${n}칸 이동`:`${n}칸 이동 (면제권 그대로)`;
    o.onclick=()=>{$('pick').classList.remove('on');if(d){t.pass--;toast(`🛡️ ${t.name} 면제권으로 ${d>0?'+1':'−1'}칸!`);S.log+=` · 🛡️${d>0?'+1':'−1'}칸`;save();renderBoard()}res(n)};return o};
  box.append(opt(-1,'−1칸'),opt(0,'그대로'),opt(1,'+1칸'));
  $('pickT').textContent=`🎲 ${mv}칸! ${t.name}, 🛡️ 면제권(${t.pass}개)으로 1칸 조정할까요?`;$('pick').classList.add('on');
})}

// 📣 중계: 지금 판 상황을 한 줄로 (TV 화면에서 분위기 띄우기)
function castLine(){const T=S.teams;if(!T||!T.length||S.phase!=='play')return '';const prog=t=>t.laps*24+t.pos;const lines=[];
  const lead=[...T].sort((a,b)=>prog(b)-prog(a))[0];lines.push(`🏃 선두 ${lead.name} (${lead.laps}/${S.goal}바퀴)`);
  const hot=T.filter(t=>(t.streak||0)>=2).sort((a,b)=>b.streak-a.streak)[0];if(hot)lines.push(`${JURU()?"⚡":"🔥"} ${hot.name} ${hot.streak}연승 질주!`);
  if(JURU()){const k=[...T].sort((a,b)=>(b.drinks||0)-(a.drinks||0))[0];if(k.drinks)lines.push(`🍻 술왕 후보 ${k.name} ${k.drinks}잔`)}
  else{const near=T.filter(t=>!lostT(t)&&CAP()-(t.drinks||0)===1);if(near.length)lines.push(`⚠️ ${near.map(t=>t.name).join(', ')} 상한까지 1잔!`)}
  if(S.final)lines.push('🏁 파이널 랩 진행 중');return lines.join('  ·  ')}
function show(){
  setSub();watchSolo();
  document.body.classList.toggle('juru',JURU());document.body.classList.toggle('final',!!S.final&&S.phase==='play');$('muteBtn').textContent=S.mute?'🔇':'🔊';
  {const lg=document.querySelector('.legend');lg.innerHTML=JURU()?'<span><i style="background:#E8436A"></i>🍺 마시기</span><span><i style="background:#3E7BFA"></i>🎮 게임</span><span><i style="background:#9B51E0"></i>🎯 지목·선택</span><span><i style="background:#22B8D8"></i>쉬어가기</span><span><i style="background:#F6B90B"></i>황금카드</span>'
    :`<span><i style="background:#F0524F"></i>⚔️ ${SOLO()?'1:1 대결':'상대 팀과'}</span><span><i style="background:#2FB36B"></i>🏠 ${SOLO()?'나 혼자':'우리 팀'}</span><span><i style="background:#3E7BFA"></i>👥 ${SOLO()?'모두':'모든 팀'}</span><span><i style="background:#22B8D8"></i>쉬어가기</span><span><i style="background:#F6B90B"></i>황금카드</span>`}
  const ok=S.teams&&S.teams.length>=2;
  const over=S.phase==='over'&&ok, play=S.phase==='play'&&ok;
  $('setup').hidden=play||over;$('game').hidden=!play;$('over').hidden=!over;$('resetBtn').hidden=!play;
  if(over)renderOver();else if(play){buildBoard();renderBoard()}else renderSetup();
}
load();applyTheme();show();setDie($('d1'),1);setDie($('d2'),1);if(S.pend&&S.phase==='play')_ST(resumeTurn,300);
</script>
